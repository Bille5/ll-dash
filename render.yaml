# Render Blueprint — deploy this dashboard plus a free Postgres database
# with one click: https://render.com/docs/blueprint-spec
#
# No team-specific configuration is needed here. On first visit the app
# walks you through a setup wizard (team number, season, FTC API
# credentials, PIN, branding).
services:
  - type: web
    name: ftc-dash
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()" --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ftc-dash-db
          property: connectionString

databases:
  - name: ftc-dash-db
    plan: free
